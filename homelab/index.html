<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>HomeLab: От Авито до Дата-Центра</title>
    <meta
      name="description"
      content="Симулятор домашнего сервера: барахолка, сборка, Linux и Windows Server, RAID, обжим кабелей и защита от DDoS."
    />
    <meta name="theme-color" content="#0b1219" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HomeLab" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <style>
      html,
      body {
        margin: 0;
        background: #080b11;
        color: #dce8f7;
        font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        gap: 14px;
        text-align: center;
        padding: 24px;
      }
      #boot .logo {
        width: 76px;
        height: 76px;
        border-radius: 20px;
        border: 1px solid #2c5c44;
        background: linear-gradient(145deg, #1c3a2c, #10231b);
        display: grid;
        place-items: center;
        font-size: 36px;
        margin: 0 auto 12px;
        box-shadow: 0 0 30px rgba(62, 224, 138, 0.2);
      }
      #boot h1 {
        font-size: 17px;
        margin: 0 0 6px;
        letter-spacing: -0.2px;
      }
      #boot p {
        margin: 0;
        color: #5f7387;
        font-family: ui-monospace, monospace;
        font-size: 12px;
      }
      #boot .bar {
        width: 160px;
        height: 4px;
        border-radius: 99px;
        background: #16222e;
        overflow: hidden;
        margin: 16px auto 0;
      }
      #boot .bar span {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 99px;
        background: linear-gradient(90deg, #1ca566, #3ee08a);
        animation: bootbar 1.1s ease-in-out infinite;
      }
      @keyframes bootbar {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(260%);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot">
      <div>
        <div class="logo">🗄️</div>
        <h1>HomeLab</h1>
        <p>поднимаем стойку…</p>
        <div class="bar"><span></span></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
