<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#070b14">
  <meta name="color-scheme" content="dark">
  <title>Server Tycoon: Datacenter Sandbox</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand-row">
        <div class="brand-mark" aria-hidden="true"></div>
        <div class="brand-copy">
          <strong>SERVER TYCOON</strong>
          <span>DATACENTER SANDBOX</span>
        </div>
        <button id="pauseBtn" class="icon-button" aria-label="Пауза"></button>
      </div>
      <div id="hud" class="hud"></div>
    </header>

    <main id="main" class="main-content">
      <section id="view" class="view" aria-live="polite"></section>
    </main>

    <nav id="bottomNav" class="bottom-nav" aria-label="Основное меню"></nav>
  </div>

  <div id="modalRoot" class="modal-root" aria-hidden="true"></div>
  <div id="toastRoot" class="toast-root" aria-live="assertive"></div>
  <div id="dragGhost" class="drag-ghost"></div>

  <script src="js/icons.js"></script>
  <script src="js/data.js"></script>
  <script src="js/game.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
