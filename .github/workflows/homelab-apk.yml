name: HomeLab APK

# Собирает Android APK игры HomeLab (папка homelab/) и прикладывает файл к запуску.
# Запуск: вручную (Actions → HomeLab APK → Run workflow) или тегом v*.
on:
  workflow_dispatch:
  push:
    branches: [main, 'arena/**']
    paths:
      - 'homelab/**'
      - '.github/workflows/homelab-apk.yml'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  apk:
    name: Собрать APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: homelab
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: homelab/package-lock.json

      - name: JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        # На ubuntu-latest SDK уже предустановлен: только принимаем лицензии
        # и докладываем нужные пакеты, если чего-то не хватает.
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if command -v sdkmanager >/dev/null 2>&1; then SDKMAN=sdkmanager;
          elif [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then SDKMAN="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager";
          else SDKMAN=""; fi
          echo "sdkmanager: ${SDKMAN:-не найден}"
          if [ -n "$SDKMAN" ]; then
            yes | "$SDKMAN" --licenses >/dev/null 2>&1 || true
            "$SDKMAN" "platform-tools" "platforms;android-35" "build-tools;35.0.0" >/dev/null 2>&1 || true
          fi
          ls "$ANDROID_HOME" || true

      - name: Зависимости
        run: npm ci

      - name: Тест логики
        run: npm run test

      - name: Тест баланса
        run: npm run test:balance

      - name: Тест рендера экранов
        run: npm run test:render

      - name: Тест интерфейса (jsdom)
        run: |
          set +e
          npm run test:dom > /tmp/dom.log 2>&1
          code=$?
          tail -40 /tmp/dom.log
          if [ $code -ne 0 ]; then
            echo "::error title=jsdom-fail::$(tail -14 /tmp/dom.log | tr '\n' ' | ' | cut -c1-1400)"
          fi
          exit $code

      - name: Веб-сборка
        run: npm run build

      - name: Синхронизация с Android-проектом
        run: npx cap sync android

      - name: Проверить ключ подписи (или создать новый)
        working-directory: homelab/android
        run: |
          set -e
          if [ -f keystore.properties ] && keytool -list -keystore "keystore/$(sed -n 's/^storeFile=keystore\///p' keystore.properties)" \
               -storepass "$(sed -n 's/^storePassword=//p' keystore.properties)" >/dev/null 2>&1; then
            echo "✓ Ключ подписи на месте"
          else
            echo "Ключ не читается — создаём новый для этой сборки"
            rm -f keystore.properties
            ../scripts/make_keystore.sh ci-build.jks "homelab-$RANDOM-$RANDOM"
            # подпись созданного ключа действует только для этого запуска
          fi

      - name: Кэш Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('homelab/android/**/*.gradle', 'homelab/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Сборка APK
        working-directory: homelab/android
        run: |
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon --stacktrace assembleRelease > /tmp/gradle.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            echo "::error title=gradle-release::$(grep -Ei 'what went wrong|error:|failed' -A3 /tmp/gradle.log | tail -30 | tr '\n' ' | ' | cut -c1-1500)"
            echo "--- release не собрался, пробуем debug ---"
            ./gradlew --no-daemon --stacktrace assembleDebug > /tmp/gradle-debug.log 2>&1
            dcode=$?
            if [ $dcode -ne 0 ]; then
              echo "::error title=gradle-debug::$(grep -Ei 'what went wrong|error:|failed' -A3 /tmp/gradle-debug.log | tail -30 | tr '\n' ' | ' | cut -c1-1500)"
              exit $dcode
            fi
            mkdir -p app/build/outputs/apk/release
            cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk
          fi
          ls -la app/build/outputs/apk/release/

      - name: Переименовать артефакт
        working-directory: homelab
        run: |
          mkdir -p artifacts
          VERSION=$(grep -m1 'versionName' android/app/build.gradle | sed -E 's/.*"([^"]+)".*/\1/')
          cp android/app/build/outputs/apk/release/app-release.apk \
             "artifacts/HomeLab-${VERSION}-${GITHUB_RUN_NUMBER}.apk"
          ls -lh artifacts
          sha256sum artifacts/*.apk > artifacts/SHA256SUMS.txt

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: HomeLab-APK
          path: homelab/artifacts/
          if-no-files-found: error

      - name: Приложить к релизу
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: homelab/artifacts/HomeLab-*.apk

      # Публикуем готовый APK в отдельную ветку homelab-builds,
      # чтобы файл можно было скачать прямо из репозитория (Raw → Save).
      - name: Опубликовать APK в ветку homelab-builds
        working-directory: homelab
        run: |
          set -e
          TMP="$(mktemp -d)"
          cp artifacts/*.apk artifacts/SHA256SUMS.txt "$TMP"/
          cd "$TMP"
          git init -q
          git checkout -q -b homelab-builds
          {
            echo "# HomeLab APK — готовые сборки"
            echo
            echo "Скачай APK из файлов этой ветки: $(ls *.apk)"
            echo
            echo "Установка: разреши «Установка из неизвестных источников» и открой файл."
            echo "Сборка №$GITHUB_RUN_NUMBER, коммит \`${GITHUB_SHA::7}\`."
            echo
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } > README.md
          git config user.name "homelab-build-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git -c commit.gpgsign=false commit -qm "HomeLab APK: сборка №$GITHUB_RUN_NUMBER"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:homelab-builds

      - name: Постоянная ссылка на сборку
        run: |
          echo "### 📦 APK готов" >> $GITHUB_STEP_SUMMARY
          echo "Ветка \`homelab-builds\`: https://github.com/${{ github.repository }}/tree/homelab-builds" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat homelab/artifacts/SHA256SUMS.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
