name: Recover original Physics Playground

on:
  push:
    branches:
      - arena/a254aa0f-atari2600emulator-typescript
    paths:
      - PhysicsPlayground.pck
      - .github/workflows/recover-physics-playground.yml

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/a254aa0f-atari2600emulator-typescript

      - name: Recover the original Godot project
        run: |
          set -o pipefail
          mkdir -p physics-playground-j2me/original/recovered
          {
            set -x
            mkdir -p /tmp/gdre/bin
            curl -fL --retry 3 \
              https://github.com/GDRETools/gdsdecomp/releases/download/v2.7.4/GDRE_tools-v2.7.4-linux.zip \
              -o /tmp/gdre/gdre.zip
            unzip -q /tmp/gdre/gdre.zip -d /tmp/gdre/bin
            find /tmp/gdre/bin -maxdepth 2 -type f -printf '%p %s bytes\n'
            GDRE=$(find /tmp/gdre/bin -type f -name 'gdre_tools.x86_64' -print -quit)
            test -n "$GDRE"
            chmod +x "$GDRE"
            "$GDRE" --headless \
              --recover="$PWD/PhysicsPlayground.pck" \
              --output="$PWD/physics-playground-j2me/original/recovered"
            find physics-playground-j2me/original/recovered -type f -printf '%p %s bytes\n'
          } 2>&1 | tee physics-playground-j2me/original/recovery.txt

      - name: Return recovered sources and diagnostics to this branch
        if: always()
        run: |
          mkdir -p physics-playground-j2me/original
          git add -A physics-playground-j2me/original
          if git diff --cached --quiet; then
            echo "No recovered files or diagnostics were produced"
            exit 0
          fi
          git config user.name "Arena Recovery Bot"
          git config user.email "arena-recovery@users.noreply.github.com"
          git commit -m "Recover original Physics Playground sources"
          git push origin HEAD:arena/a254aa0f-atari2600emulator-typescript
